document_discrepancies:
- id: rgb_led_port
  pages:
  - 1
  - 2
  - 3
  - 14
  - 15
  details: Most sections use Port 1 for controls and LEDs, but the page 3 RGB behavior table says Port 0.
  map_policy: Use Port 1 as preferred metadata and retain Port 0 as an explicit alternate documented value.
- id: play_record_leds
  pages:
  - 2
  - 7
  - 15
  details: Page 2 assigns Play a green LED and Record a red LED; page 15 says both have no LED. Page 7 lists Play but omits
    Record in the bulk LED list.
  map_policy: Mark both targets as document_conflict rather than asserting support.
- id: stop_all_clips_bulk_led
  pages:
  - 2
  - 7
  - 15
  details: Stop All Clips is marked LED None on pages 2 and 15 but appears in the page 7 single-LED bulk command list.
  map_policy: Retain it only as a bulk-table anomaly.
- id: single_led_note_range
  pages:
  - 2
  - 6
  - 15
  details: Page 6 states button values 0x40-0x5B, while Record is 0x5D and Shift is 0x62. Shift is documented without an LED.
  map_policy: Use explicit target lists instead of trusting the printed range.
- id: introduction_response_length
  page: 13
  details: The response declares a four-byte payload but lists nine fader values.
  map_policy: Preserve the declared length and listed fields separately; do not auto-correct.
- id: introduction_response_controls
  pages:
  - 1
  - 13
  - 15
  details: The device has 8 knobs, but the introduction response lists 9 faders.
  map_policy: Preserve the protocol terminology and mark it as a conflict.
- id: palette_duplicate_rows
  page: 5
  details: The printed table repeats palette rows 117-127. The map contains one entry for each velocity 0-127.
  map_policy: Deduplicate by velocity without altering the printed RGB value.
- id: ui_button_count
  pages:
  - 1
  - 14
  - 15
  details: The overview states 20 UI buttons, while the control map names 19 physical buttons (17 with MIDI note values and
    two octave buttons that send no Note On/Off). No twentieth button command is identified.
  map_policy: Represent every named control and do not invent an additional button mapping.
- id: typographical_hex_prefixes
  pages:
  - 9
  - 10
  - 12
  details: Several cells print 00x4E or 00x7F. They are normalized to 0x4E and 0x7F.
  map_policy: Normalize obvious typographical prefixes while recording this note.
