# Akai APC Key 25 mk2 MIDI/SysEx command map
# Generated from the supplied Communications Protocol v1.1 PDF.
# Hexadecimal scalars are ordinary YAML integers when loaded with PyYAML safe_load().
# Document contradictions are preserved under document_discrepancies.

schema:
  name: akai_midi_command_map
  version: '1.0'
  python_loader: yaml.safe_load
  data_types: YAML primitives only; no Python-specific YAML tags
  byte_notation: Hexadecimal YAML integers are loaded as normal Python ints by PyYAML.
source:
  document: APC Key 25 mk2 - Communication Protocol - v1.1.pdf
  title: AKAI Professional APC Key 25 mk2 Communications Protocol
  protocol_version: '1.1'
  document_date: '2023-02-09'
  sha256: ee06aa845371f72f1c736f548c931577af3e4983d08397dcdc3717d860da5d72
  scope: Only commands and mappings documented in the supplied PDF are represented. Inferred standard MIDI byte formulas are
    explicitly labeled.
device:
  manufacturer: Akai Professional
  model: APC Key 25 mk2
  aliases:
  - APC Key 25 MK2
  - APC Key 25 mk2
  manufacturer_id: 0x47
  sysex_device_id: 0x7F
  product_model_id: 0x4E
  pad_grid:
    rows: 5
    columns: 8
    count: 40
  keybed:
    keys: 25
    velocity_sensitive: true
  knob_count: 8
  ui_button_count_documented: 20
  ui_button_names_in_control_map: 19
conventions:
  direction:
    outbound: host_to_device
    inbound: device_to_host
  midi_channels: 'Zero-based: 0-15 correspond to status-byte low nibbles 0x0-0xF.'
  ports: Port numbers are metadata from the protocol and are not bytes in the MIDI message.
  status_formulas:
    note_off:
      formula: 0x80 | channel
      standard_midi_derived: true
    note_on:
      formula: 0x90 | channel
      standard_midi_derived: true
    control_change:
      formula: 0xB0 | channel
      standard_midi_derived: true
  sysex_7bit_length:
    msb_formula: (length >> 7) & 0x7F
    lsb_formula: length & 0x7F
    derived_from_documented_msb_lsb_fields: true
ports:
  0:
    documented_use:
    - keybed notes
    - sustain CC
  1:
    documented_use:
    - pads
    - UI buttons
    - knobs
    - MIDI LED control
  rgb_led_conflict:
    preferred_port: 1
    reason: Pages 1, 2, 14, and 15 consistently associate controls/LEDs with Port 1.
    alternate_documented_port: 0
    alternate_source: The RGB LED behavior table on page 3 labels every entry Port 0.
