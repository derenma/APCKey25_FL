midi_messages:
  inbound:
    note_event:
      template:
      - status
      - note
      - velocity
      statuses:
        note_off_base: 0x80
        note_on_base: 0x90
      controls:
      - keybed
      - clip_launch_pads
      - buttons
    control_change_event:
      template:
      - status
      - cc
      - value
      status_base: 0xB0
      controls:
      - sustain
      - knobs
  outbound:
