      - pad_note
      - palette_velocity
      status_formula: 0x90 | behavior_channel
      note_off_documentation: Page 1 mentions Note On/Off for LED control, but the detailed RGB command sections specify only
        Note On messages.
      timing_sync: Pulse and blink rates are synchronized to an external clock rate.
      pad_note_range:
      - 0x00
      - 0x27
      palette_velocity_range:
      - 0x00
      - 0x7F
      behaviors:
        solid_10_percent:
          channel: 0
          status: 0x90
          function: On at 10% brightness
        solid_25_percent:
          channel: 1
          status: 0x91
          function: On at 25% brightness
        solid_50_percent:
          channel: 2
          status: 0x92
          function: On at 50% brightness
        solid_65_percent:
          channel: 3
          status: 0x93
          function: On at 65% brightness
        solid_75_percent:
          channel: 4
          status: 0x94
          function: On at 75% brightness
        solid_90_percent:
          channel: 5
          status: 0x95
          function: On at 90% brightness
        solid_100_percent:
          channel: 6
          status: 0x96
          function: On at 100% brightness
        pulse_1_16:
